# Benchmarked models.
#
# Credentials are never stored here - `base_url_env` / `api_key_env` name the
# environment variable that holds them (see .env.example).
#
# Endpoints:
#   helmcode -> HELMCODE_BASE_URL / HELMCODE_API_KEY   https://api.helmcode.com/v1
#   nan      -> NAN_BASE_URL / NAN_API_KEY             https://api.nan.builders/v1
#
# Placement rule: Helmcode by default; NaN only when a model is not on Helmcode.
#
# ---------------------------------------------------------------------------
# Model ids VERIFIED LIVE against GET /v1/models and a 1-token completion on
# 2026-08-27. Do not trust the doc pages over this file:
#
#   * Helmcode's own docs say `glm-5.2`. The API serves `glm5.2` (no hyphen).
#     The docs are wrong; `mondaybench endpoints` catches it.
#   * The spec's ids `glm-5.3`, `qwen-3.8-flash` and `kimi-k3` exist nowhere.
#   * The same model is spelled differently per platform. Never copy an id
#     across endpoints - re-verify with `mondaybench endpoints`.
#
# Pricing below was measured from the `cost_details` the gateway returns, not
# taken from a price list. Models whose responses carry no cost field are
# covered by the plan and are left null rather than claimed as $0 - a plan has a
# real cost, so "free per run" would be misleading. Cost never affects the
# Monday Score.
#
# A reported `cost` does NOT mean a model draws on prepaid credit. When the
# organisation's credit ran out, every model listed here kept working; only the
# third-party frontier models (claude-*, gpt-*, gemini-*) failed, with
# "not covered by any subscription tier". So the cost figures below are
# accounting detail on plan-covered inference, not a prepaid balance being
# drawn down. Only the JUDGE is exposed to credit exhaustion.
# ---------------------------------------------------------------------------
#
# Response caching: DISABLED on every model, deliberately.
#
# Both endpoints cache a response for an identical prompt. Measured: a repeat of
# the same request returned in 715ms with a byte-identical response, against
# 32,327ms for the real generation. Three "official runs" would have been two
# generations and a stored copy, deflating run_range and sigma to zero.
#
# `extra_body: {caching: false}` is sent in the request body. It changes nothing
# the model sees - the messages are byte-identical and the prompt hash stays
# ed4d7beb - so it is an API-specific parameter of the kind IMPLEMENTATION.md s35
# allows, documented here rather than hidden. Verified: with caching:false the
# same prompt produced a different response (39,357ms), i.e. a genuine sample.
#
# Run qualification independently rejects any run whose response duplicates
# another run of the same model, so a cache hit cannot reach a published score
# even if this flag stops working.
#
# Output budget: 32,000 for every model, uniformly.
#
# The spec's 4,000 is too small for the thinking models here. glm5.3-flash spent
# its entire 4,000-token budget on `reasoning_content` and emitted no answer at
# all - a zero score caused by configuration, not capability, which s35 warns
# against ("do not artificially cripple every model into identical internals").
# The budget is raised for ALL models rather than per-model so generation
# settings stay identical and scores stay comparable; the non-reasoning models
# used 1,000-3,300 tokens and are unaffected by the headroom.
#
# 16,000 -> 32,000 on 2026-08-28. deepseek-v4-flash hit the same wall glm5.3-flash
# hit at 4,000: two consecutive attempts produced 69,501 and 70,207 characters of
# reasoning and no answer at all, while its two earlier runs had completed at this
# same budget the day before. Raising it for one model would have been per-model
# tuning to rescue that model, so it was raised for all seven and the whole
# battery regenerated - `official.qualify_run` rejects any run whose recorded
# max_output_tokens differs from the configured one, which is exactly the rule
# that forces the redo rather than allowing a mixed-budget ranking.
#
# The 16,000 battery (20 runs, judged) is kept under archive/budget-16000/.
#
# On NaN the cap is advisory: qwen3.8-flash returned 35 completion tokens against
# max_tokens=1, and 10,464 against 4,000. Expect finish_reason=length to be
# unreliable there - the runner records whatever the provider reports.
#
# ---------------------------------------------------------------------------
# THIS VALUE IS A SAFETY CEILING, NOT A SHARED COMPUTE BUDGET.
# ---------------------------------------------------------------------------
# Corrected 2026-08-29 after the token-budget audit (analysis/token-budget-audit.md,
# 77 runs). `max_output_tokens` reaches the wire as the legacy Chat Completions
# `max_tokens`; `max_completion_tokens` is never sent. Providers do not apply it
# consistently to reasoning models:
#
#   helmcode/deepseek-v4-flash   counts reasoning against it, stops exactly on it
#   nan/mimo-v2.5                same
#   nan/qwen3.8-flash            does not apply it; has returned +84%
#   the other four               never approached it; behaviour UNKNOWN
#
# A number applied that inconsistently cannot equalise compute across models,
# and the paragraph above - written when the budget was raised from 16,000 -
# describes an intent the providers do not implement. MondayBench no longer
# tries: it evaluates each model under its documented standard serving
# configuration and reports reasoning tokens, completion tokens, TTFA, latency
# and cost separately from the Monday Score.
#
# The 32,000 below stays because monday-001..003 were generated under it and
# `qualify_run` compares a run against the configured value; changing it here
# would stop three published batteries verifying. From monday-004 a scenario
# declares its own ceiling in `scenario.yaml` under
# `generation.safety_ceiling_tokens`, verified against every endpoint before use
# (tools/probe_output_ceiling.py). monday-004 uses 96,000.
#
# Reasoning policy (IMPLEMENTATION.md s36): each model runs in its standard
# public API mode. A reasoning-enabled variant needs its own slug
# (`model-x-thinking`), never a shared one.

# ---------------------------------------------------------------------------
# Per-scenario endpoint overrides
# ---------------------------------------------------------------------------
#
# A model's endpoint is part of its serving configuration, and run qualification
# rejects a run whose provider differs from the configured one. So moving a model
# to a different endpoint above does not only change future runs - it
# retroactively disqualifies every run already published under the old endpoint.
# qwen3.6 has three official runs in each of monday-001, 002 and 003, all served
# by Helmcode; editing its `provider:` line would have broken three frozen
# batteries at once.
#
# This scopes the change to the scenario that needs it. A scenario not listed
# here uses the endpoints declared above, unchanged.
#
# Not in scenario.yaml deliberately: that file is covered by FROZEN.yaml, and a
# serving detail must not be able to change a published scenario's content hash.
#
# THE COST, stated rather than buried: a model served from a different endpoint
# is not strictly comparable with its own results on other scenarios. Same
# weights, different serving stack - latency and TTFA especially are properties
# of the endpoint, not the model. Any cross-scenario view must say so.
#
# IN USE for monday-004/qwen3.6, and the caveat below must travel with the
# result wherever it is published.
#
# Helmcode was unreachable through 2026-08-30 and 2026-08-31 (DNS resolved, TCP
# timed out) while the monday-004 official battery was being generated. NaN
# serves the same model id, so qwen3.6's three official monday-004 runs come
# from NaN.
#
# THE ENDPOINTS ARE NOT INTERCHANGEABLE FOR THIS MODEL. NaN serves qwen3.6 as a
# REASONING model and Helmcode does not, on a byte-identical request that sets
# `reasoning_requested: false`:
#
#   Helmcode  3,659 output tokens,     0 reasoning tokens
#   NaN       8,102-9,079 output,  5,228-6,308 reasoning
#
# NaN reports `explicit_reasoning_tokens` and the adapter observes ~6,800
# reasoning stream deltas. That is a different inference regime, not a different
# data centre, and `capabilities.reasoning: false` below is true of Helmcode
# only.
#
# MEASURED AFTERWARDS, and it is not what was predicted. The expectation when
# this override was switched on was that the reasoning regime would inflate the
# score. It did not. The same model on the same scenario under the same rubric:
#
#   Helmcode, no reasoning      base 54.5
#   NaN, ~6,000 reasoning tok   base 51.5 / 54.0 / 53.5   (mean 53.0)
#
# The net criterion-level difference is -1.8 points out of 100, and it runs both
# ways: the NaN runs find the duplicated invoice and normalise the annual
# prepayment, which the Helmcode run missed, and lose the funnel and growth
# comparisons in exchange. Six thousand reasoning tokens moved nothing.
#
# So the caveat stands, but not for the reason first written down. What is not
# comparable is the serving configuration, not the score's level:
#
#   * qwen3.6's monday-004 score is NOT comparable with its monday-001..003
#     scores, because it was produced under a different inference regime. The
#     measurement above says the regime did not change the quality; it does not
#     say the two are the same product.
#   * Its latency, TTFA and token counts on monday-004 are properties of NaN.
#     These DO differ materially - 8,102-9,079 output tokens against 3,659.
#   * Overall v1 will average a monday-004 score obtained under a different
#     serving configuration from the three that precede it. The release note
#     has to carry this.
#   * Do not repeat the original claim that the NaN score would be higher. It
#     was a reasonable guess and it was wrong, and it is recorded here so it is
#     not made again.
#
# It is scoped to monday-004 alone. monday-001..003 declare no override, so
# qwen3.6's nine published runs there keep their Helmcode provider and go on
# qualifying - which is the entire reason this mechanism exists instead of an
# edit to the `provider:` line above.
scenario_endpoint_overrides:
  monday-004:
    qwen3.6: nan

models:

  # ---- Helmcode (default endpoint) ----

  deepseek-v4-flash:
    display_name: "DeepSeek V4 Flash"
    provider: helmcode
    api_style: openai_compatible
    model_id: "deepseek-v4-flash"
    base_url_env: HELMCODE_BASE_URL
    api_key_env: HELMCODE_API_KEY
    generation:
      temperature: 0
      max_output_tokens: 32000
    extra_body:
      # See the cache note in the header. Not part of the prompt.
      caching: false
    capabilities:
      reasoning: true
    pricing:
      input_per_million_usd: 0.175
      output_per_million_usd: 0.35
      source: "measured from gateway cost_details, 2026-08-27"
    notes: >
      1M context. Reports reasoning_tokens in usage, so it thinks by default -
      capabilities.reasoning is true accordingly.

  glm5.2:
    display_name: "GLM 5.2"
    provider: helmcode
    api_style: openai_compatible
    model_id: "glm5.2"
    base_url_env: HELMCODE_BASE_URL
    api_key_env: HELMCODE_API_KEY
    generation:
      temperature: 0
      max_output_tokens: 32000
    extra_body:
      # See the cache note in the header. Not part of the prompt.
      caching: false
    capabilities:
      reasoning: true
    pricing:
      input_per_million_usd: 0.70
      output_per_million_usd: 2.20
      source: "measured from gateway cost_details, 2026-08-27"
    notes: >
      500K context. The docs list this as a EUR 150/month add-on, but the key
      calls it successfully and is billed per token, so no add-on gate applies
      here. Reports reasoning_tokens.

  qwen3.6:
    display_name: "Qwen 3.6"
    provider: helmcode
    api_style: openai_compatible
    model_id: "qwen3.6"
    base_url_env: HELMCODE_BASE_URL
    api_key_env: HELMCODE_API_KEY
    generation:
      temperature: 0
      max_output_tokens: 32000
    extra_body:
      # See the cache note in the header. Not part of the prompt.
      caching: false
    capabilities:
      reasoning: false
    pricing:
      input_per_million_usd: null
      output_per_million_usd: null
      source: "covered by plan; gateway returns no per-token cost"
    notes: "256K context. Plan-covered."

  gemma4:
    display_name: "Gemma 4"
    provider: helmcode
    api_style: openai_compatible
    model_id: "gemma4"
    base_url_env: HELMCODE_BASE_URL
    api_key_env: HELMCODE_API_KEY
    generation:
      temperature: 0
      max_output_tokens: 32000
    extra_body:
      # See the cache note in the header. Not part of the prompt.
      caching: false
    capabilities:
      reasoning: false
    pricing:
      input_per_million_usd: null
      output_per_million_usd: null
      source: "covered by plan; gateway returns no per-token cost"
    notes: >
      256K context. Plan-covered. Expected to be the weakest tier, which is
      what calibration needs to check the rubric discriminates at the bottom.

  # ---- NaN (only for models Helmcode does not serve) ----
  #
  # Enumerated live from api.nan.builders on 2026-08-27. NaN serves 6 language
  # models: deepseek-v4-flash, gemma4, qwen3.6 (all also on Helmcode, so they
  # stay on Helmcode per the placement rule), plus the three below.
  #
  # The two "new" models were absent from https://nan.builders/docs/models and
  # the spec guessed their ids with the wrong hyphenation:
  #   spec `glm-5.3-flash`   -> actually `glm5.3-flash`
  #   spec `qwen-3.8-flash`  -> actually `qwen3.8-flash`
  # `kimi-k3` is served by neither platform and has been dropped.
  #
  # NaN returns no per-token cost: it is quota-based (2B tokens/month for
  # deepseek, 1B for mimo). Pricing stays null rather than claimed as $0.
  #
  # Token accounting note: on prompts under ~100 tokens NaN reports a floor of
  # roughly 84 prompt tokens where Helmcode reports the true count. At realistic
  # sizes the two agree exactly (verified: a 184-token prompt reads 184 on
  # both), so the ~2,900-token benchmark prompt is unaffected and cross-platform
  # comparison holds. It is not a hidden system prompt.

  glm5.3-flash:
    display_name: "GLM 5.3 Flash"
    provider: nan
    api_style: openai_compatible
    model_id: "glm5.3-flash"
    base_url_env: NAN_BASE_URL
    api_key_env: NAN_API_KEY
    generation:
      temperature: 0
      max_output_tokens: 32000
    extra_body:
      # See the cache note in the header. Not part of the prompt.
      caching: false
    capabilities:
      reasoning: true
    pricing:
      input_per_million_usd: null
      output_per_million_usd: null
      source: "NaN is quota-based; no per-token cost reported"
    notes: "Not on Helmcode. Reports reasoning_tokens, so it thinks by default."

  qwen3.8-flash:
    display_name: "Qwen 3.8 Flash"
    provider: nan
    api_style: openai_compatible
    model_id: "qwen3.8-flash"
    base_url_env: NAN_BASE_URL
    api_key_env: NAN_API_KEY
    generation:
      temperature: 0
      max_output_tokens: 32000
    extra_body:
      # See the cache note in the header. Not part of the prompt.
      caching: false
    capabilities:
      reasoning: true
    pricing:
      input_per_million_usd: null
      output_per_million_usd: null
      source: "NaN is quota-based; no per-token cost reported"
    notes: >
      Not on Helmcode. Thinks by default and did NOT honour max_tokens=1 in a
      probe (returned 35 completion tokens, 29 of them reasoning), so watch for
      finish_reason=length - the runner records it and the leaderboard warns.

  mimo-v2.5:
    display_name: "MIMO v2.5"
    provider: nan
    api_style: openai_compatible
    model_id: "mimo-v2.5"
    base_url_env: NAN_BASE_URL
    api_key_env: NAN_API_KEY
    generation:
      temperature: 0
      max_output_tokens: 32000
    extra_body:
      # See the cache note in the header. Not part of the prompt.
      caching: false
    capabilities:
      # Corrected 2026-08-28. This was `false`, and the provider reports
      # `usage.reasoning_tokens: 0`, so nothing in the numbers said otherwise.
      # But all six official runs stream a thinking phase before their first
      # answer token - 16-24s on monday-001, 139-162s on monday-002 - which the
      # harness times as the gap between TTFT and TTFA. The model thinks; the
      # provider just does not count it. Declaring it here brings MIMO inside
      # the reasoning-delivery guard, so a future run served without thinking
      # is rejected instead of averaged in. No existing run is affected: they
      # classify DELIVERED on the stream evidence.
      reasoning: true
    pricing:
      input_per_million_usd: null
      output_per_million_usd: null
      source: "NaN is quota-based; no per-token cost reported"
    notes: "1M context. Not on Helmcode. NaN quota 1.0B tokens/month. Streams a
      thinking phase but reports reasoning_tokens=0; delivery is established
      from the pre-answer stream instead of the counter."
