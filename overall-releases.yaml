      deepseek-v4-flash and glm5.3-flash each produced one reasoning-only
      generation with no answer, and qwen3.8-flash took one HTTP 429. None of
      those attempts is scored. mondaybench serving publishes attempts per
      valid run.

      MONDAY-005 IS OUT-OF-SAMPLE. Its rubric was revised three times while
      reading a separate 21-run calibration battery, which is archived under
      archive/monday-005-v0.4-calibration/ and enters no official score. The
      official battery is 21 fresh runs generated after the freeze, and their
      independence is enforced mechanically by leaderboard.check_sample_provenance
      rather than asserted - 21 calibration samples against 21 official samples,
      zero overlap by response content and by provider request id.

