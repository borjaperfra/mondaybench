# MondayBench Overall releases.
#
# An Overall release is a claim about a fixed set of scenarios. It names them
# explicitly so that adding a scenario later cannot move a number that was
# already published: Overall v1 and Overall v2 are different claims, and both
# stay reproducible from this file plus the per-scenario leaderboards.
#
# Monday Score = arithmetic mean of the model's official score on each scenario
# listed. Equal weight per scenario, no weighting infrastructure, and nothing
# else folded in - not latency, TTFA, reasoning or completion tokens, cost, run
# stability, serving qualification or attempt count. Those are published beside
# the score, never inside it.
#
# A model is ranked only if it has an official score on EVERY scenario in the
# release. Averaging over whichever scenarios a model happens to have finished
# would reward not competing. Incomplete models are published separately with
# the missing scenario ids named.
#
# `prompt_sha256` and `rubric_version` pin what each scenario's published result
# must still hash to. If a scenario is re-frozen or re-scored, the build fails
# loudly rather than silently rewriting a published Overall score.
#
# `status: draft` means the release names a scenario that is not official yet.
# A draft can be built as a clearly-labelled PREVIEW into analysis/overall/;
# it cannot be written to leaderboard/overall/.

releases:
  - overall_version: 0
    label: "Overall v0 — the three published scenarios"
    status: released
    aggregation: arithmetic_mean
    note: >
      The first Overall result. It covers the three scenarios that were
      published before monday-004 existed, so it is a complete and permanent
      claim about those three - not a partial view of a four-scenario
      benchmark. When monday-004 becomes official it enters as Overall v1,
      alongside this one rather than replacing it.
    scenarios:
      - id: monday-001
        prompt_sha256: ed4d7beb1d7d1029c36eb8533e449027e0dc1a1047f8a38951a91781a0a5e398
        rubric_version: "0.2"
      - id: monday-002
        prompt_sha256: 740e627cbc7413c321ede0d54000504de54821d34ff4677f82731b89600423a8
        rubric_version: "0.2"
      - id: monday-003
        prompt_sha256: aaf788f309d955d2b427c86fe7d95d2bbf88575fde7306adcfd74b0ec4a4103f
        rubric_version: "0.3"

  - overall_version: 1
    label: "Overall v1 — through Numbers Don't Lie"
    # RELEASED 2026-08-31, after monday-004's official leaderboard was published.
    # This was a separate deliberate act from publishing monday-004, which is
    # why the status is stored here rather than inferred from whether the
    # scenarios happen to be published.
    status: released
    aggregation: arithmetic_mean
    note: >
      Adds monday-004 "Numbers Don't Lie" to the three scenarios of Overall v0.
      All four are frozen, official and pinned below by prompt hash and rubric
      version; monday-004 is scored under rubric 0.3, the rubric its freeze
      covers.

      CARRY THIS WHEREVER THE v1 NUMBER IS QUOTED. Qwen 3.6's monday-004 runs
      were served by NaN, not Helmcode, under a per-scenario endpoint override -
      Helmcode was unreachable while that battery was generated. NaN serves
      qwen3.6 as a REASONING model and Helmcode does not, on a byte-identical
      request: roughly 6,000 reasoning tokens against zero. So qwen3.6's v1
      average blends one scenario produced under a different inference regime
      with three that were not. Measured afterwards, the regime moved the score
      by -1.8 points out of 100 and in both directions at criterion level, so
      this is a caveat about serving configuration and about latency, TTFA and
      token counts - which do differ materially - not a claim that the score is
      inflated. models.yaml carries the full measurement.

      GLM 5.2's monday-004 run-005 was generated a day late: the Helmcode
      gateway returned HTTP 402 for that model on 2026-08-31 and then cleared
      with no change on this side. The run qualifies on every configuration
      check and the delay does not affect comparability; the record is in
      runs/monday-004/glm5.2/SERVING-INCIDENT.md.
    scenarios:
      - id: monday-001
        prompt_sha256: ed4d7beb1d7d1029c36eb8533e449027e0dc1a1047f8a38951a91781a0a5e398
        rubric_version: "0.2"
      - id: monday-002
        prompt_sha256: 740e627cbc7413c321ede0d54000504de54821d34ff4677f82731b89600423a8
        rubric_version: "0.2"
      - id: monday-003
        prompt_sha256: aaf788f309d955d2b427c86fe7d95d2bbf88575fde7306adcfd74b0ec4a4103f
        rubric_version: "0.3"
      - id: monday-004
        prompt_sha256: 3a0cbb569ca4f711b8907177af9204cec267d26f35f732829df56b03ed23ef99
        rubric_version: "0.3"
