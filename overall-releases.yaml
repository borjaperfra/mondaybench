    label: "Overall v0 — the three published scenarios"
    status: released
    aggregation: arithmetic_mean
    note: >
      The first Overall result. It covers the three scenarios that were
      published before monday-004 existed, so it is a complete and permanent
      claim about those three - not a partial view of a four-scenario
      benchmark. When monday-004 becomes official it enters as Overall v1,
      alongside this one rather than replacing it.
