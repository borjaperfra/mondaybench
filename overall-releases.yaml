  - overall_version: 3
    revision: 2
    label: "Overall v3.2 - GPT-6 Astra added"
    status: released
    suite_version: "1.3"
    aggregation: arithmetic_mean
    note: >
      A REVISION OF v3, NOT A NEW VERSION. Same five scenarios, same frozen
      prompts, same rubric versions, same arithmetic, same judge contract. One
      model is added and nothing else moves: every incumbent Monday Score here
      is identical to its v3.1 score, and the re-stamp into suite v1.3 changed
      zero labels and zero scores across 151 evaluations.

      THE CHALLENGER DID NOT RUN THROUGH THIS HARNESS. GPT-6 Astra's fifteen
      responses were generated through the Codex CLI, because no authenticated
      Astra API route was available. The canonical scenario inputs are the
      frozen ones - every prompt sha256 matches this suite - and each candidate
      ran in its own ephemeral session with no carry-over and no recorded tool
      use. What the runtime does not expose is recorded as null, never as a
      number: temperature, top_p, caching, the output ceiling, the resolved
      model id, finish reason, request ids, TTFT, TTFA, reasoning tokens and
      every token count. Its reasoning effort was set to medium, the highest
      that runtime offers. All of this travels with the runs in
      `provider_metadata.codex_runtime`, and the challenger pack that produced
      them is preserved under `astra-mondaybench-challenger/`.

      ONE QUALIFICATION RULE CHANGED, AND IT APPLIES TO EVERY MODEL. The safety
      ceiling check now compares only when a run records a ceiling. A run that
      records none is not a mismatch, it is a run whose ceiling was never
      observable, and refusing it would be rejecting evidence that is absent
      rather than evidence that is wrong - the same rule the reasoning check has
      always applied. No published run changes status: all 393 of them record an
      integer. THE COST: for a run with neither a ceiling nor a finish reason,
      nothing in this harness can independently rule out that the answer was
      truncated. For Astra that assurance rests on the Codex completion events -
      returncode 0, turn completed, final message present on all fifteen - which
      is the runtime's own word, recorded rather than verified here.

      TELEMETRY IS ABSENT, NOT ZERO. Astra publishes no latency, no token counts
      and no cost. Those cells are empty for it in the same way they are empty
      for any model whose provider stopped returning cost details.
    scenarios:
