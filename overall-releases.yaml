    aggregation: arithmetic_mean
    note: >
      A REVISION OF v3, NOT A NEW VERSION. Same five scenarios, same frozen
      prompts, same rubric versions, same arithmetic, same judge contract. Every
      incumbent Monday Score here is identical to its v3.3 score, and the
      re-stamp into suite v1.5 changed zero labels and zero scores across 151
