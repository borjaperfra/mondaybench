# MondayBench Overall releases.
#
# An Overall release is a claim about a fixed set of scenarios. It names them
# explicitly so that adding a scenario later cannot move a number that was
# already published: Overall v1 and Overall v2 are different claims, and both
# stay reproducible from this file plus the per-scenario leaderboards.
#
# Monday Score = arithmetic mean of the model's official score on each scenario
# listed. Equal weight per scenario, no weighting infrastructure, and nothing
# else folded in - not latency, TTFA, reasoning or completion tokens, cost, run
# stability, serving qualification or attempt count. Those are published beside
# the score, never inside it.
#
# A model is ranked only if it has an official score on EVERY scenario in the
# release. Averaging over whichever scenarios a model happens to have finished
# would reward not competing. Incomplete models are published separately with
# the missing scenario ids named.
#
# `prompt_sha256` and `rubric_version` pin what each scenario's published result
# must still hash to. If a scenario is re-frozen or re-scored, the build fails
# loudly rather than silently rewriting a published Overall score.
#
# `status: draft` means the release names a scenario that is not official yet.
# A draft can be built as a clearly-labelled PREVIEW into analysis/overall/;
# it cannot be written to leaderboard/overall/.

releases:
  - overall_version: 0
    label: "Overall v0 — the three published scenarios"
    status: released
    aggregation: arithmetic_mean
    note: >
      The first Overall result. It covers the three scenarios that were
      published before monday-004 existed, so it is a complete and permanent
      claim about those three - not a partial view of a four-scenario
      benchmark. When monday-004 becomes official it enters as Overall v1,
      alongside this one rather than replacing it.
    scenarios:
      - id: monday-001
        prompt_sha256: ed4d7beb1d7d1029c36eb8533e449027e0dc1a1047f8a38951a91781a0a5e398
        rubric_version: "0.2"
      - id: monday-002
        prompt_sha256: 740e627cbc7413c321ede0d54000504de54821d34ff4677f82731b89600423a8
        rubric_version: "0.2"
      - id: monday-003
        prompt_sha256: aaf788f309d955d2b427c86fe7d95d2bbf88575fde7306adcfd74b0ec4a4103f
        rubric_version: "0.3"

  - overall_version: 1
    label: "Overall v1 — through Numbers Don't Lie"
    # RELEASED 2026-08-31, after monday-004's official leaderboard was published.
    # This was a separate deliberate act from publishing monday-004, which is
    # why the status is stored here rather than inferred from whether the
    # scenarios happen to be published.
    status: released
    aggregation: arithmetic_mean
    note: >
      Adds monday-004 "Numbers Don't Lie" to the three scenarios of Overall v0.
      All four are frozen, official and pinned below by prompt hash and rubric
      version; monday-004 is scored under rubric 0.3, the rubric its freeze
      covers.

      CARRY THIS WHEREVER THE v1 NUMBER IS QUOTED. Qwen 3.6's monday-004 runs
      were served by NaN, not Helmcode, under a per-scenario endpoint override -
      Helmcode was unreachable while that battery was generated. NaN serves
      qwen3.6 as a REASONING model and Helmcode does not, on a byte-identical
      request: roughly 6,000 reasoning tokens against zero. So qwen3.6's v1
      average blends one scenario produced under a different inference regime
      with three that were not. Measured afterwards, the regime moved the score
      by -1.8 points out of 100 and in both directions at criterion level, so
      this is a caveat about serving configuration and about latency, TTFA and
      token counts - which do differ materially - not a claim that the score is
      inflated. models.yaml carries the full measurement.

      GLM 5.2's monday-004 run-005 was generated a day late: the Helmcode
      gateway returned HTTP 402 for that model on 2026-08-31 and then cleared
      with no change on this side. The run qualifies on every configuration
      check and the delay does not affect comparability; the record is in
      runs/monday-004/glm5.2/SERVING-INCIDENT.md.
    scenarios:
      - id: monday-001
        prompt_sha256: ed4d7beb1d7d1029c36eb8533e449027e0dc1a1047f8a38951a91781a0a5e398
        rubric_version: "0.2"
      - id: monday-002
        prompt_sha256: 740e627cbc7413c321ede0d54000504de54821d34ff4677f82731b89600423a8
        rubric_version: "0.2"
      - id: monday-003
        prompt_sha256: aaf788f309d955d2b427c86fe7d95d2bbf88575fde7306adcfd74b0ec4a4103f
        rubric_version: "0.3"
      - id: monday-004
        prompt_sha256: 3a0cbb569ca4f711b8907177af9204cec267d26f35f732829df56b03ed23ef99
        rubric_version: "0.3"

  - overall_version: 2
    label: "Overall v2 — through Read the Room"
    # RELEASED after monday-005's official battery was published. v0 and v1 are
    # untouched and stay valid: each is a permanent claim about its own set of
    # scenarios, not a superseded draft of this one.
    status: released
    aggregation: arithmetic_mean
    note: >
      Adds monday-005 "Read the Room" to the four scenarios of Overall v1. All
      five are frozen, official and pinned below by prompt hash and rubric
      version; monday-005 is scored under rubric 0.4, the rubric its freeze
      covers.

      Monday Score is the arithmetic mean of the five official scenario scores,
      equal weight per scenario. Each scenario score is itself the arithmetic
      mean of three valid official runs. Nothing else enters it: not latency,
      TTFA, cost, reasoning tokens, serving reliability, run range, standard
      deviation, penalty count or scenario wins. Across-scenario range and
      sigma are published beside the score and are descriptive only - and they
      measure variation across five different kinds of work, which is not the
      same quantity as run-to-run stability inside one scenario.

      SERVING RELIABILITY IS EXCLUDED FROM THE SCORE AND REPORTED SEPARATELY.
      Three models needed a retry to complete the monday-005 battery -
      deepseek-v4-flash and glm5.3-flash each produced one reasoning-only
      generation with no answer, and qwen3.8-flash took one HTTP 429. None of
      those attempts is scored. mondaybench serving publishes attempts per
      valid run.

      MONDAY-005 IS OUT-OF-SAMPLE. Its rubric was revised three times while
      reading a separate 21-run calibration battery, which is archived under
      archive/monday-005-v0.4-calibration/ and enters no official score. The
      official battery is 21 fresh runs generated after the freeze, and their
      independence is enforced mechanically by leaderboard.check_sample_provenance
      rather than asserted - 21 calibration samples against 21 official samples,
      zero overlap by response content and by provider request id.

      CARRIED FORWARD FROM v1, because it is still true of the monday-004
      component of every v2 average. Qwen 3.6's monday-004 runs were served by
      NaN, not Helmcode, under a per-scenario endpoint override - Helmcode was
      unreachable while that battery was generated. NaN serves qwen3.6 as a
      REASONING model and Helmcode does not, on a byte-identical request:
      roughly 6,000 reasoning tokens against zero. Measured afterwards, the
      regime moved the score by -1.8 points out of 100 and in both directions
      at criterion level, so this is a caveat about serving configuration and
      about latency, TTFA and token counts - which do differ materially - not a
      claim that the score is inflated. models.yaml carries the measurement.
    scenarios:
      - id: monday-001
        prompt_sha256: ed4d7beb1d7d1029c36eb8533e449027e0dc1a1047f8a38951a91781a0a5e398
        rubric_version: "0.2"
      - id: monday-002
        prompt_sha256: 740e627cbc7413c321ede0d54000504de54821d34ff4677f82731b89600423a8
        rubric_version: "0.2"
      - id: monday-003
        prompt_sha256: aaf788f309d955d2b427c86fe7d95d2bbf88575fde7306adcfd74b0ec4a4103f
        rubric_version: "0.3"
      - id: monday-004
        prompt_sha256: 3a0cbb569ca4f711b8907177af9204cec267d26f35f732829df56b03ed23ef99
        rubric_version: "0.3"
      - id: monday-005
        prompt_sha256: 532cd464a9b75045f808886c44e667237d6fd1b947826510643b9f8bcc30059a
        rubric_version: "0.4"

  # ---------------------------------------------------------------------------
  - overall_version: 3
    label: "Overall v3 — the v1.1 evaluator contract"
    status: released
    suite_version: "1.1"
    aggregation: arithmetic_mean
    note: >
      A NEW VERSION, NOT A REVISION OF v2, AND THE DISTINCTION IS THE POINT.

      A revision adds MODELS to a fixed scenario set - that is what `revision`
      means here and what `load_releases` enforces. v3 keeps the same five
      scenarios, the same frozen prompts, the same rubric versions and the same
      arithmetic, and it does add a model. But it also reads a different suite's
      scenario boards: the v1.1 boards, built from evaluations carrying the
      scenario-specific judge contract fingerprint. `scenario_provenance` would
      therefore differ from v2's, and a decimal point cannot carry that.

      WHAT v1.1 CHANGED, AND WHAT IT DID NOT. It changed how a judge contract is
      identified. `judge_prompt_fingerprint()` hashed global repository state,
      including the shared penalty vocabulary - which grew as scenarios were
      added, so a model judged after monday-005 could not share a board with
      incumbents judged before it, despite byte-identical rubrics. v1.1 hashes a
      scenario-specific rendered contract instead.

      It changed NO candidate generation, NO rubric, NO ground truth and NO
      judgment. Every v1.1 evaluation replays the same recorded verdict file
      through the same deterministic scoring code; the migration gate proves,
      for all 121 migrated evaluations, that zero criterion labels, zero
      false-action judgments, zero penalty verdicts and zero scores moved. Every
      incumbent's Monday Score in v3 is identical to its v2 score.

      This is a provenance and comparability fix. It is not a score correction,
      and nobody should read it as one.

      GLM 5.3 is the first model published under the v1.1 contract. Its
      generation predates the migration and cleared every official gate at the
      time; what it could not clear was a fingerprint comparison that described
      the repository rather than the scenario.

      v2 stays byte-frozen and remains the citable v1.0 artifact.
    scenarios:
      - id: monday-001
        prompt_sha256: ed4d7beb1d7d1029c36eb8533e449027e0dc1a1047f8a38951a91781a0a5e398
        rubric_version: "0.2"
      - id: monday-002
        prompt_sha256: 740e627cbc7413c321ede0d54000504de54821d34ff4677f82731b89600423a8
        rubric_version: "0.2"
      - id: monday-003
        prompt_sha256: aaf788f309d955d2b427c86fe7d95d2bbf88575fde7306adcfd74b0ec4a4103f
        rubric_version: "0.3"
      - id: monday-004
        prompt_sha256: 3a0cbb569ca4f711b8907177af9204cec267d26f35f732829df56b03ed23ef99
        rubric_version: "0.3"
      - id: monday-005
        prompt_sha256: 532cd464a9b75045f808886c44e667237d6fd1b947826510643b9f8bcc30059a
        rubric_version: "0.4"
