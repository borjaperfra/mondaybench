      WHAT CHANGED, AND WHY. DeepSeek V4.1 Flash now has ONE battery on this
      board instead of two, and it is a new one. The gateway serves this model
      under an id it shares with DeepSeek V4 Flash and replaced the deployment
      in place rather than publishing a second id, so the same request reaches
      different weights at different times. Measured on 2026-09-11, the same
      five prompts through the same endpoint produce reasoning volumes 1.3x to
      2.5x the 2026-09-10 battery's at equal or better throughput - a change no
      amount of load explains. The 2026-09-10 battery therefore no longer
      describes what the id serves, and a board row is a claim about what a
      caller gets today.

      WHAT IS NO LONGER CARRIED. Two batteries are not in this suite: the
      2026-09-10 one and its reliability-prompt variant. Their runs, verdicts
      and v1.4 evaluations are untouched on disk and v1.4 still verifies; they
      are simply not members of v1.5. The reliability variant goes with them
      because its control no longer exists as a current measurement - a treated
      arm published without its untreated arm is a number with nothing to
      difference against. A later experiment against the current deployment
      found the same prompt worth +0.04 points under the judge who scored this
      board, which is not an effect.

      THE ROW IS THE NATURAL CONFIGURATION. No reliability prompt, no
      reasoning_effort, the harness default system prompt, temperature 0 and the
      scenarios' own ceilings - the same configuration every other row on this
      board ran under.
