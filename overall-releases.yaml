  - overall_version: 3
    revision: 3
    label: "Overall v3.3 - DeepSeek V4.1 Flash reliability prompt added"
    status: released
    suite_version: "1.4"
    aggregation: arithmetic_mean
    note: >
      A REVISION OF v3, NOT A NEW VERSION. Same five scenarios, same frozen
      prompts, same rubric versions, same arithmetic, same judge contract. One
      row is added and nothing else moves: every incumbent Monday Score here is
      identical to its v3.2 score, and the re-stamp into suite v1.4 changed zero
      labels and zero scores across 166 evaluations.

      WHAT THE NEW ROW IS. The same model as DeepSeek V4.1 Flash, run against
      the same five frozen scenarios through the same endpoint, the same
      model id, the same temperature, the same ceilings and the same retry
      policy. ONE thing differs: a general reliability system prompt replaces
      the harness default. It is a separate slug and a separate row because a
      Monday Score is the mean of a model's own runs, and averaging a treated
      battery into an untreated one would put two different configurations
      behind one number. The prompt is generic by construction - it names no
      scenario, no rubric criterion, no reference answer and no prior failure -
      and is published byte-exact with its sha256 alongside the machine-checked
      control proof that was written before generation.

      WHAT THE COMPARISON SHOWS, AND WHAT IT DOES NOT. Read against the
      incumbent the treated battery is 5.70 points higher; read against the same
      model's untreated variance probe it is 1.16 higher. Those two untreated
      batteries differ from each other by 4.54 points, which is the yardstick
      any treatment effect has to beat, so the difference in the MEAN is not
      distinguishable from this model's own run-to-run variation. What does move
      is the floor: the worst run of the treated battery is 79.5 against 47.5
      and 57.0 untreated, and mean run-to-run range falls from 18.80 and 12.40
      to 10.20. The effect is concentrated in monday-004 and is not uniform -
      on monday-003 the treated battery is the widest of the three.

      JUDGE VARIANCE IS THE SAME SIZE AS THE EFFECT. These fifteen responses
      were judged twice, independently, from the same blind pack: 90.33 and
      93.47, a 3.14-point spread on the same runs. The published figure is the
      one produced by the same judge as every other row on this board, because
      a row scored by a different judge would sit above the board for that
      reason alone. The second pass is recorded in the experiment directory.
    scenarios:
