      covers.

      Monday Score is the arithmetic mean of the five official scenario scores,
      equal weight per scenario. Each scenario score is itself the arithmetic
      mean of three valid official runs. Nothing else enters it: not latency,
      TTFA, cost, reasoning tokens, serving reliability, run range, standard
      deviation, penalty count or scenario wins. Across-scenario range and
      sigma are published beside the score and are descriptive only - and they
      measure variation across five different kinds of work, which is not the
      same quantity as run-to-run stability inside one scenario.

      SERVING RELIABILITY IS EXCLUDED FROM THE SCORE AND REPORTED SEPARATELY.
