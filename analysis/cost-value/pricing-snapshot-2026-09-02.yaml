      `deepseek-v4-pro` and `deepseek-v4-flash-vision-exp`; the run model id is
      character-identical to the first.

      ONE NEW CONSTRAINT FOUND AND APPLIED: peak is 01:00-04:00 and 06:00-10:00
      UTC **Monday through Friday**. The previous calculator applied the hour
      windows without the weekday condition. Re-checked: all three
      peak-window runs fell on Friday 2026-08-28, so the band assignment is
      unchanged (3 peak / 12 off-peak) - but the formula is now correct.

      Timezone is UTC, matching the runs' own `timestamp_utc`, so band
      assignment is unambiguous per run. DeepSeek states "Product prices may
      vary and DeepSeek reserves the right to adjust them" and publishes no
      effective date.

      PUBLISHED AS A RANGE. Because the price depends on when the task runs,
      $/1k is given as off-peak to peak, $12.94-$25.88. Pareto placement uses
      the conservative (peak) end so the figure cannot flatter this model.

