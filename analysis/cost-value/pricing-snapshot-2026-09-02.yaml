  # =========================================================================
  qwen3.8-flash:
    model: Qwen 3.8 Flash
    provider: Alibaba Cloud Model Studio (served to MondayBench via the NaN gateway)
    run_model_id: qwen3.8-flash
    pricing_sku: qwen3.8-flash
    identity_confidence: AMBIGUOUS      # region not determinable - publish a RANGE
    pricing_mode: regional_range
    input_per_million: {low: 0.113, high: 0.15}
    output_per_million: {low: 0.382, high: 0.47}
    cache_read_per_million: UNPUBLISHED
    cache_write_per_million: UNPUBLISHED
    effective_date: 2026-09-02
    promotion: null
    source_url: https://www.alibabacloud.com/help/en/model-studio/model-pricing
    source_type: vendor_pricing_page
    retrieved_at: 2026-09-02
    pricing_confidence: MEDIUM
    notes: >
      DOWNGRADED AT THIS GATE, from HIGH/point to MEDIUM/range. The previous
      figure ($0.15 / $0.47 / cache read $0.016 / cache write $0.20) came from
      OpenRouter, which the tightened source policy disallows. Alibaba's own
      pricing page shows two things the aggregator did not:

      1. PRICING IS REGIONAL. Singapore (International) is $0.15 / $0.47;
         China (Beijing), Hong Kong, Germany (Frankfurt), US (Virginia) and
         Japan (Tokyo) are all $0.113 / $0.382 - a 23% spread. MondayBench
         served this model through the NaN gateway and nothing in the run
         records identifies which region NaN uses, or whether NaN fronts
         Alibaba at all. Identity is therefore AMBIGUOUS on region and the
         cost is published as a RANGE, per the identity gate.
      2. CACHE PRICES ARE NOT PUBLISHED for this model. Alibaba's context-cache
         documentation states explicitly that the explicit-cache hit price for
         qwen3.8-flash "is not 10% of the standard input token price. For
         specific pricing, see the Model Studio console", and the same for the
         implicit cache. Cache creation is given only as "typically 125% of the
         standard input token price". No first-party number exists, so the
         cache rates are UNPUBLISHED.

      MATERIALITY, MEASURED. Cache lines are 0.14% of this model's total
      normalized cost (output alone is 95.7%), so the unpublished cache rates
      are immaterial - the calculator keeps $0.016 read / $0.20 write as a
      documented non-first-party placeholder whose removal changes the total by
      under 0.2%. The REGION is what matters: $12.61/1k to $15.56/1k.
      No tiering by context length applies (flat to 1M tokens).

