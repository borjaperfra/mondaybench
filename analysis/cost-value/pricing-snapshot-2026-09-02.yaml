# MondayBench pricing snapshot - FROZEN after first-party verification gate
#
# snapshot_id:    pricing-2026-09-02
# effective_date: 2026-09-02
# status:         FROZEN
#
# PURPOSE. Reproducible NORMALIZED API COST: what each MondayBench workload
# would cost at the model's PUBLIC LIST PRICE, independent of the gateway deal,
# plan or quota the benchmark actually ran under.
#
# THIS IS NOT WHAT THE BENCHMARK PAID. Reported cost stays in each run's
# `economics` block and is never overwritten.
#
# SOURCE POLICY, tightened at this gate. Every published price now comes from a
# FIRST-PARTY vendor source: the vendor's own pricing page or API documentation.
# OpenRouter, models.dev, Artificial Analysis, resellers, aggregators and blogs
# were used ONLY to locate those pages and are cited nowhere as justification.
# Two prices previously resting on third-party sources were re-sourced at this
# gate, and one identity was downgraded as a result.
#
# LIST PRICE ONLY. Promotions are recorded in a separate `promotion` block and
# are never used for the headline comparison, so the main table stays valid
# after a promotion ends.
#
# CURRENCY. USD per 1,000,000 tokens.

snapshot_id: pricing-2026-09-02
effective_date: 2026-09-02
status: FROZEN
currency: USD
unit: per_1M_tokens
source_policy: first_party_only

models:

  # =========================================================================
  claude-fable-5-1:
    model: Claude Fable 5.1
    provider: Anthropic (Claude API, first party)
    run_model_id: claude-fable-5-1
    pricing_sku: Claude Fable 5.1
    identity_confidence: EXACT
    input_per_million: 10.00
    output_per_million: 50.00
    cache_read_per_million: 0.25
    cache_write_per_million: 20.00
    cache_write_5m_per_million: 12.50
    pricing_mode: flat
    effective_date: 2026-09-02
    promotion: null
    source_url: https://platform.claude.com/docs/en/about-claude/pricing
    source_type: vendor_pricing_page
    retrieved_at: 2026-09-02
    pricing_confidence: HIGH
    notes: >
      ALL FIVE RATES CONFIRMED ON ANTHROPIC'S OWN PRICING PAGE. The model table
      row reads: base input $10/MTok, 5m cache writes $12.50/MTok, 1h cache
      writes $20/MTok, cache hits and refreshes $0.25/MTok, output $50/MTok. A
      footnote states cache hits on Fable 5.1 and Mythos 5.1 are priced at
      0.025x base input, against the 0.1x used by every other model - which is
      why $0.25 rather than $1.00.

      1-HOUR CACHE SEMANTICS CONFIRMED. The prompt-caching table gives
      "1-hour cache write | 2x base input price | Cache valid for 1 hour",
      i.e. $20/MTok, and notes the 1h write pays off after two cache reads.
      $20.00 is therefore the published rate, not an inference.

      THIS WAS THE MODALITY CLAUDE CODE USED. Independently established from the
      meter: solving the provider-reported costUSD for the cache-write rate
      returns $20.000/MTok on every cache-writing run (A1, monday-001 run 1,
      monday-004 run 1 all agree to three decimals). The harness documents a
      1-hour prompt-cache TTL for this session.

      STRONGEST END-TO-END VALIDATION IN THE SET, PRESERVED: with these five
      rates, normalized list cost equals provider-reported cost on ALL 15 RUNS
      at 0.00% error. Identity is EXACT because the served route and the
      list-price vendor are the same party.

      NOT the Claude subscription price - explicitly excluded. Batch (-50%),
      fast mode and the inference_geo 1.1x multiplier are all published but none
      applies to these runs.

