# MondayBench PROVIDER-PUBLIC pricing snapshot
#
# snapshot_id:    provider-pricing-2026-09-02
# effective_date: 2026-09-02
# pricing_class:  PROVIDER_PUBLIC
# status:         FROZEN
#
# WHAT THIS IS. Public pricing published by a third-party provider that serves a
# model, used ONLY as a fallback where no canonical first-party commercial price
# could be established. It is a SEPARATE artefact from the first-party snapshot
# (`pricing-snapshot-2026-09-02.yaml`, sha256 ec4dcc85...f389598), which is
# unchanged and remains authoritative.
#
# WHAT THIS IS NOT. Not a model list price. A provider price is the commercial
# offer of one reseller/router for one route, and reflects that provider's
# margins, discounts and backend mix - not the model vendor's own rate. It must
# never be presented as, substituted for, or averaged with a first-party price.
#
# PRIORITY, as applied:
#   1. FIRST_PARTY_LIST + EXACT
#   2. FIRST_PARTY_LIST + STRONG_MATCH
#   3. PROVIDER_PUBLIC + EXACT / STRONG_MATCH   <- this file
#   4. UNKNOWN
# No model that already has a valid first-party price was moved to a provider
# price, cheaper or not.
#
# IDENTITY RULE. Only EXACT or STRONG_MATCH may receive a provider price.
# AMBIGUOUS and NO_MATCH stay UNKNOWN. Two of the three candidate models failed
# this test and remain UNKNOWN.
#
# CURRENCY. USD per 1,000,000 tokens.

snapshot_id: provider-pricing-2026-09-02
effective_date: 2026-09-02
pricing_class: PROVIDER_PUBLIC
status: FROZEN
currency: USD
unit: per_1M_tokens
first_party_snapshot_ref: pricing-snapshot-2026-09-02.yaml
first_party_snapshot_sha256: ec4dcc8537bf4af5a8944f7cc15cda5b55f789826a535b8b665b0c256f389598

models:

  # =========================================================================
  # RESOLVED - provider price published
  # =========================================================================
  mimo-v2.5:
    model: MIMO v2.5
    run_model_id: mimo-v2.5
    run_provider: nan
    pricing_class: PROVIDER_PUBLIC
    provider_name: OpenRouter
    provider_model_id: xiaomi/mimo-v2.5
    identity_confidence: EXACT
    input_per_million: 0.119
    output_per_million: 0.238
    cache_read_per_million: 0.00255
    cache_write_per_million: null        # not published for this route
    reasoning_per_million: null          # not billed separately
    pricing_mode: flat
    effective_date: 2026-09-02
    source: https://openrouter.ai/xiaomi/mimo-v2.5
    source_type: provider_public_model_page
    retrieved_at: 2026-09-02
    first_party_status: UNKNOWN
    notes: >
      IDENTITY EXACT, on three independent signals: the OpenRouter slug
      `xiaomi/mimo-v2.5` is character-identical to the MondayBench run
      `model_id`; the route's context length is 1,050,000 tokens against
      models.yaml's recorded "1M context"; and there is exactly one non-Pro
      MIMO v2.5 route on OpenRouter. The sibling `xiaomi/mimo-v2.5-pro` is a
      distinct SKU at roughly 3.7x the price and does not match the run id.

      ROUTING LIMITATION, DOCUMENTED AS REQUIRED. This OpenRouter route is
      served by five upstream providers - GMICloud, DeepInfra, Xiaomi,
      StreamLake and NovitaAI - whose individual prices differ. OpenRouter
      publishes ONE consolidated price for the route, described on the page as
      reflecting the average price customers actually pay, accounting for
      caching and provider discounts. Per the analysis brief, a single published
      route price is usable as PROVIDER_PUBLIC even though the backend may vary;
      the caveat is that this is a BLENDED ROUTE PRICE, not a fixed contractual
      rate, and a request routed to a specific backend could cost more or less.

      REASONING SEMANTICS. MondayBench records `reasoning_tokens: 0` on all 17
      stored MIMO runs while the model demonstrably streams a thinking phase -
      classification (D), not observable (see billing-semantics.md). OpenRouter
      publishes no separate reasoning-token rate for this route, so billable
      output is `output_tokens` alone. No double-counting is possible: there is
      no second reasoning line and none is added.

      FIRST PARTY REMAINS UNKNOWN. Xiaomi's own commercial rate for MIMO v2.5
      was not established at the first-party gate: candidates spanned about 8x
      ($0.14/$0.28 in a stale catalogue entry, and a search summary asserting a
      permanent move to $1/$3 in May 2026). This provider price does not resolve
      that question and does not claim to. The stale catalogue figure of
      $0.14/$0.28 is also superseded by the live page read here.

  # =========================================================================
  # NOT RESOLVED - identity AMBIGUOUS, stays UNKNOWN
  # =========================================================================
  qwen3.6:
    model: Qwen 3.6
    run_model_id: qwen3.6
    run_provider: helmcode (and nan for the monday-004 battery)
    pricing_class: null
    provider_name: OpenRouter
    provider_model_id: null
    identity_confidence: AMBIGUOUS
    input_per_million: UNKNOWN
    output_per_million: UNKNOWN
    cache_read_per_million: UNKNOWN
    cache_write_per_million: UNKNOWN
    pricing_mode: null
    effective_date: null
    source: https://openrouter.ai/qwen/qwen3.6-35b-a3b
    source_type: candidates_inspected_no_unique_match
    retrieved_at: 2026-09-02
    first_party_status: UNKNOWN
    notes: >
      NO UNIQUE ROUTE. The MondayBench run id is a bare `qwen3.6` with no
      variant, and OpenRouter carries at least five Qwen 3.6 routes. Filtering
      by the one hard signal available - models.yaml records "256K context" -
      leaves THREE candidates at 262,144 tokens, and they are not close in
      price:

        qwen/qwen3.6-35b-a3b      $0.05 / $0.70   (35B total, 3B active)
        qwen/qwen3.6-27b          $0.60 / $3.60
        qwen/qwen3.6-max-preview  $1.027 / $6.162

      Applied to the MondayBench token profile these give $2.47, $14.21 and
      $23.95 per 1,000 tasks - a 9.7x spread. `qwen3.6-flash` and
      `qwen3.6-plus` are excluded on context (1M, not 256K).

      A second signal points the other way and cannot break the tie: every
      OpenRouter Qwen 3.6 route is a reasoning model, while models.yaml declares
      `capabilities.reasoning: false` for this model. That declaration is a
      statement about how MondayBench configured the model rather than about the
      model itself - and empirically the NaN-served monday-004 battery did
      return reasoning tokens - so it disambiguates nothing.

      Choosing among three candidates spanning 9.7x would decide this model's
      position in the cost table by fiat. AMBIGUOUS -> UNKNOWN.

  gemma4:
    model: Gemma 4
    run_model_id: gemma4
    run_provider: helmcode
    pricing_class: null
    provider_name: OpenRouter
    provider_model_id: null
    identity_confidence: AMBIGUOUS
    input_per_million: UNKNOWN
    output_per_million: UNKNOWN
    cache_read_per_million: UNKNOWN
    cache_write_per_million: UNKNOWN
    pricing_mode: null
    effective_date: null
    source: https://openrouter.ai/google/gemma-4-31b-it
    source_type: candidates_inspected_no_unique_match
    retrieved_at: 2026-09-02
    first_party_status: UNKNOWN
    notes: >
      NO UNIQUE ROUTE. The run id is a bare `gemma4`. Both plausible OpenRouter
      routes match the recorded 256K context at 262,144 tokens and neither can
      be excluded:

        google/gemma-4-26b-a4b-it   $0.042 / $0.22   (25.2B total, 3.8B active)
        google/gemma-4-31b-it       $0.09  / $0.34   (30.7B dense, cache read $0.05)

      They are different architectures - sparse vs dense - and different
      parameter counts, and nothing in the run records, in models.yaml, or in
      Helmcode's `/v1/models` listing names a size. `:free` variants of both
      also exist at $0.

      The cost spread is NARROWER here than for Qwen 3.6 - $0.44 vs $0.83 per
      1,000 tasks, a factor of 1.9 - so a range would have been tempting. It is
      still declined: the identity rule admits only EXACT or STRONG_MATCH, and
      two architecturally distinct variants with no disambiguating evidence is
      neither. Recorded for transparency, NOT PUBLISHED as a figure.
      AMBIGUOUS -> UNKNOWN.

# ---------------------------------------------------------------------------
coverage:
  resolved_with_provider_price: [mimo-v2.5]
  still_unknown: [qwen3.6, gemma4]
  identity:
    EXACT: [mimo-v2.5]
    AMBIGUOUS: [qwen3.6, gemma4]
  models_untouched_because_first_party_exists:
    [claude-fable-5-1, glm5.3-flash, glm5.2, deepseek-v4-flash, qwen3.8-flash]
  note: >
    One of three UNKNOWNs resolved. No first-party price was replaced. Secondary
    provider prices for the five first-party models were deliberately NOT
    computed: they cannot change the primary analysis and publishing them
    alongside would invite exactly the substitution this separation exists to
    prevent.
