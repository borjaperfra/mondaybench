    max_output_tokens: 32768
    effective_date: 2026-09-02
    source: https://openrouter.ai/google/gemma-4-26b-a4b-it
    source_type: provider_public_model_page
    retrieved_at: 2026-09-02
    quoted_at_decision: {input: 0.07, output: 0.34}
    first_party_status: UNKNOWN
    cost_per_1k_tasks: 0.44
    notes: >
      PUBLICATION REFERENCE, EXPLICITLY CHOSEN. v1 left this UNKNOWN because two
      architecturally distinct routes matched the recorded 256K context -
      `gemma-4-26b-a4b-it` (25.2B total / 3.8B active, sparse) and
      `gemma-4-31b-it` (30.7B dense) - with no disambiguating evidence. That
      ambiguity is NOT resolved. The owner has selected the 26B-A4B route as the
      public reference.

      benchmark_run_identity stays AMBIGUOUS.

      CONSISTENCY CHECK: route context 262,144 matches the recorded 256K, and
      the 32,768 max output covers the runs' 32,000 ceiling - just. Gemma 4's
      observed outputs on MondayBench are small (926 tokens mean), so the
      ceiling was never approached.

      PRICE DIVERGENCE FROM THE DECISION, RECORDED. The decision quoted
      $0.07 / $0.34; the live page returned $0.042 / $0.22 on 2026-09-02. Per
      instruction the source values are used. Live gives $0.44/1k against
      $0.72/1k for the quoted pair - a 64% gap. The quoted pair matches the
      stale models.dev catalogue entry, which the live page supersedes.
      Note $0.09 / $0.34 belongs to the OTHER candidate, `gemma-4-31b-it`.

      BILLING COMPONENTS INSPECTED. Published: input, output only. Absent: cache
      read, cache write, per-request, image/multimodal, reasoning. NO
      LIMITATION IN PRACTICE: the runs record zero cache-read and zero
      cache-write tokens for this model (0/16 coverage - a non-caching
      deployment) and zero reasoning tokens, so every absent component has a
      zero quantity. The two published rates cover the whole workload.

