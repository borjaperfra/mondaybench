# MondayBench PROVIDER-PUBLIC pricing snapshot — v2
#
# snapshot_id:    provider-pricing-2026-09-02-v2
# effective_date: 2026-09-02
# pricing_class:  PROVIDER_PUBLIC
# status:         FROZEN
# supersedes:     provider-pricing-2026-09-02 (v1), sha256
#                 6cb250f3dbbcf7043d63fa50f188184326388dd0e5f9132524cd9c4ebe503fac
#                 v1 is PRESERVED on disk unchanged, with its own .sha256.
#
# WHAT CHANGED IN v2. Two models move from UNKNOWN to a published
# PROVIDER_PUBLIC price on an explicit publication decision by the project
# owner: Qwen 3.6 and Gemma 4. MIMO v2.5 is carried forward unchanged.
#
# THE NATURE OF THAT DECISION MATTERS AND IS RECORDED PER MODEL. For Qwen 3.6
# and Gemma 4 the benchmark run identity remains AMBIGUOUS - the bare gateway id
# never identified a commercial variant, and v1 declined to guess. v2 does not
# claim to have solved that. What v2 records is a *publication reference*: a
# named, verifiable OpenRouter route chosen by the owner to stand in for the
# model's cost. The distinction is preserved in three separate fields:
#
#   benchmark_run_identity:      AMBIGUOUS            (unchanged, never upgraded)
#   publication_pricing_ref:     USER_CONFIRMED_REFERENCE
#   provider_route_identity:     EXACT                (the route itself is exact)
#
# This is the claim being made:
#   "To represent the cost of Qwen 3.6 / Gemma 4 we use this public OpenRouter
#    variant as the reference."
# This is NOT the claim being made:
#   "We have shown the run was served by OpenRouter on this variant."
#
# STILL NOT FIRST-PARTY. No first-party price was replaced or reclassified. The
# first-party snapshot (pricing-snapshot-2026-09-02.yaml, sha256
# ec4dcc85...f389598) is untouched and remains authoritative for the five models
# it covers.
#
# PRICES ARE AS RETURNED BY THE SOURCE AT VERIFICATION TIME, not as quoted in
# the decision. Both diverged; see `quoted_at_decision` on each entry.
#
# CURRENCY. USD per 1,000,000 tokens.

