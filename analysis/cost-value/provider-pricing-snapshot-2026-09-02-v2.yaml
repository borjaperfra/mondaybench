      StreamLake, NovitaAI) with differing prices; OpenRouter publishes one
      consolidated route price described as the average customers actually pay.
      Blended route price, not a fixed contractual rate.

      Xiaomi first-party rate remains UNKNOWN.

  # =========================================================================
  qwen3.6:
    model: Qwen 3.6
    run_model_id: qwen3.6
    run_provider: helmcode (and nan for the monday-004 battery)
    pricing_class: PROVIDER_PUBLIC
    provider_name: OpenRouter
    provider_model_id: qwen/qwen3.6-27b
    benchmark_run_identity: AMBIGUOUS          # UNCHANGED from v1. Never upgraded.
    publication_pricing_ref: USER_CONFIRMED_REFERENCE
    provider_route_identity: EXACT
    identity_confidence: PROVIDER_ROUTE_EXACT_RUN_AMBIGUOUS
    input_per_million: 0.30
    output_per_million: 2.00
    cache_read_per_million: 0.03
    cache_write_per_million: null              # not published for this route
    request_per_million: null                  # no per-request charge published
    image_per_million: null                    # multimodal input, no separate price published
    reasoning_per_million: null                # no reasoning rate published
    pricing_mode: flat
    context_length: 262144
    max_output_tokens: 65536
    effective_date: 2026-09-02
    source: https://openrouter.ai/qwen/qwen3.6-27b
    source_type: provider_public_model_page
    retrieved_at: 2026-09-02
    quoted_at_decision: {input: 0.289, output: 2.40}
    first_party_status: UNKNOWN
    cost_per_1k_tasks: 7.70
    notes: >
      PUBLICATION REFERENCE, EXPLICITLY CHOSEN. v1 left this UNKNOWN because
      three OpenRouter routes matched the recorded 256K context and spanned 9.7x
      in cost, with nothing in the run records to choose between them. That
      ambiguity is NOT resolved. The project owner has selected
      `qwen/qwen3.6-27b` as the public reference variant, and this snapshot
      records that choice rather than a discovery.

      benchmark_run_identity stays AMBIGUOUS. Do not read this entry as evidence
      that the MondayBench runs were served by this variant.

      CONSISTENCY CHECK (does not establish identity, but the reference is at
      least not contradicted): route context 262,144 matches the 256K recorded
      in models.yaml, and the route's 65,536 max output comfortably covers the
      32,000 ceiling the runs were generated under.

      PRICE DIVERGENCE FROM THE DECISION, RECORDED. The decision quoted
      $0.289 input / $2.40 output; the live page returned $0.30 / $2.00 on
      2026-09-02. Per instruction the source values are used. The difference is
      material to the figure: live gives $7.70/1k, the quoted pair would give
      $8.96/1k - a 16% gap. Re-verify before publication if the page has moved.

      BILLING COMPONENTS INSPECTED. Published: input, output, cache read
      ($0.03). Absent: cache write, per-request, image/multimodal, reasoning.
      Cache write is immaterial here - the runs record zero cache-write tokens.
      Reasoning tokens (17,338 across 15 runs) sit INSIDE output_tokens (48,842)
      and OpenRouter publishes no reasoning rate, so no reasoning line is added
      and no double-counting occurs.

