# MondayBench #004 "Numbers Don't Lie" - PROPOSED rubric 0.2, shadow evaluator.
#
# Same scenario, same candidate prompt, different scoring. The scenario content
# is byte-identical to what evaluator-opus5-v0.4-calibration was run against, so
# the rendered prompt still hashes to
# 3a0cbb569ca4f711b8907177af9204cec267d26f35f732829df56b03ed23ef99 and the six
# qualifying v0.1 responses can be rescored without regenerating anything.
#
# This exists to answer one question before any decision is taken: what would
# rubric 0.2 have scored? It is a shadow evaluation. Its output lives under
# evaluations/evaluator-opus5-v0.4-calibration-2/ beside the v0.1 evaluation,
# neither replaces the other, and no leaderboard is built from it.
#
# `provider: anthropic` / `model_id: claude-opus-5` record WHICH MODEL reasoned
# about the responses, for provenance. They are not a routing instruction: this
# project never calls the Anthropic API and never spends Anthropic API credits.
# Labels are produced in a recorded Claude Code session and replayed with
# `evaluate --verdicts`.
id: evaluator-opus5-v0.4-calibration-2
scenario: monday-004
scenario_version: "0.1"
rubric_version: "0.2"
rubric_file: rubric-0.2.yaml
status: calibration

judge:
  provider: anthropic
  api_style: anthropic
  model_id: claude-opus-5
  prompt_file: judge-prompt.md
  penalty_prompt_file: penalty-judge-prompt.md

generation:
  temperature: 0
  max_output_tokens: 0

behavior:
  require_evidence: true

