  monday-004.conversion_rate_vs_absolute_volume: {primary: quantitative_reasoning}
  monday-004.no_unsupported_channel_scale_decision: {primary: action_safety, secondary: business_judgment}
  monday-004.cac_payback_unavailable: {primary: uncertainty_calibration}
