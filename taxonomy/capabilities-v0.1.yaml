  monday-004.uncertainty_discipline: {primary: uncertainty_calibration}

# Criteria the taxonomy fits least well. Recorded rather than hidden: a
# taxonomy that claims a clean home for everything is usually hiding a stretch.
awkward_fits:
  - criterion: monday-004.revenue_conclusion
    note: >
      Mapped to business_judgment, but what it really measures is whether the
      conclusion reached the reader rather than staying in the workings. That
      is executive communication, and MondayBench has no capability for it
      because nothing else measures it. This single criterion is the strongest
      internal evidence for the monday-005 concept.
  - criterion: monday-001.contoso_action
    note: >
      Sits on the boundary between noticing that an item needs action and
      ordering it against the others. The two are merged in this version; if a
      later scenario separates them the merge should be revisited.
  - criterion: monday-002.avoid_acme_false_positive
    note: >
      Primary cross_source_reconciliation because the contract is what explains
      the usage drop, but the failure it prevents is a causal one. The same
      shape appears as monday-004.acme_false_positive_avoided and both are
      mapped the same way for consistency.
  - criterion: monday-003.contoso_state_separated
    note: >
      Reads as state reconstruction but is scored partly on prioritization
      consequences - keeping the cosmetic request off the contractual chain.
  - criterion: monday-001.umbrella_detected
    note: >
      Anomaly detection across a metrics table. Filed under
      quantitative_reasoning, though "notice the outlier" is arguably its own
      skill; there is only one criterion of the kind, so no capability is
      created for it.
