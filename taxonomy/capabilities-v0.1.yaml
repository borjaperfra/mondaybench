# MondayBench capability taxonomy v0.1
#
# Derived bottom-up from the 87 atomic criteria in monday-001..004, not from a
# generic benchmark taxonomy with the criteria forced into it. Several plausible
# capability names were dropped because nothing in the rubrics measures them,
# and two were merged because the criteria could not tell them apart.
#
# THIS IS NOT A SCORING SYSTEM. It changes no scenario score and no rubric. It
# answers one question: what kinds of practical work is each model consistently
# good or bad at?
#
# AGGREGATION POLICY. Scoring uses PRIMARY mappings only. A criterion tagged
# with a secondary capability contributes its points once, to the primary. The
# secondary tag is explanatory metadata - it records that the criterion also
# exercises that capability, so a reader can see the overlap without the points
# being counted twice.
#
# WHAT WAS MERGED, and why:
#   * `action_identification` into `prioritization`. monday-001's
#     action_detection dimension asks which items need action today;
#     its prioritization dimension asks which comes first. Across the eight
#     criteria involved the two are not separable - contoso_action and
#     contoso_first are the same judgment stated twice.
#   * `constraint_reasoning` into `resource_allocation` and `planning`. Every
#     constraint criterion in the set is a person or a window being scarce
#     (Marcus, Elena's Wednesday departure, the 11:00 deadline), and is already
#     measured as allocation or as schedule feasibility.
#   * `delegation` into `ownership_and_delegation`. Four criteria across three
#     scenarios ask who owns a piece of work; none asks whether to delegate
#     separately from to whom.
#
# WHAT WAS CONSIDERED AND FOUND UNMEASURED - these are the gaps that should
# shape monday-005, and they are listed in the analysis rather than invented
# here as empty capabilities:
#   audience adaptation; information boundaries / confidentiality beyond a
#   single "do not send externally" criterion; external written communication;
#   commitment discipline; cross-output consistency.

version: "0.1"

# One entry per capability. `group` is presentational; the capability is the
# unit of analysis.
capabilities:
  # ---------------------------------------------------------------- information
  state_reconstruction:
    group: information_handling
    description: >
      Determine the current state of a thing - an incident, a release, a
      contract, a piece of work - from evidence that is scattered across
      sources and partly out of date. The failure mode is reporting a state
      that was true earlier.

  supersession:
    group: information_handling
    description: >
      Recognise that a later source overrides an earlier one, and act on the
      later one. Distinct from state reconstruction: here both facts are
      present and explicit, and the question is which of them still holds.

  cross_source_reconciliation:
    group: information_handling
    description: >
      Build one finding from several sources that no single source supports,
      and refuse a finding that one source appears to support but another
      explains away.

  data_cleaning:
    group: information_handling
    description: >
      Detect and correct artifacts in the data itself - duplicated records,
      values recorded on a basis that is not comparable - before computing
      anything from them.

  entity_resolution:
    group: information_handling
    description: >
      Join records about the same entity whose identifiers differ between
      files, and notice when a naive join has silently dropped one.

  factual_accuracy:
    group: information_handling
    description: >
      Carry supplied values - deadlines, durations, owners, counts, totals -
      through the whole answer without substituting different ones. Not about
      deriving the right figure; about not corrupting a figure already given.

  # -------------------------------------------------------------------- reasoning
  quantitative_reasoning:
    group: reasoning
    description: >
      Compute a business figure correctly and choose the right basis for it:
      rates against the right denominator, distributions rather than averages,
      like-for-like comparisons, and normalisation before comparison.

  temporal_reasoning:
    group: reasoning
    description: >
      Reason about dates, durations, deadlines and availability windows, and
      decide what is reachable within them.

  dependency_reasoning:
    group: reasoning
    description: >
      Reconstruct what must happen before what, identify the chain that sets a
      delivery date, and keep work that is not on that chain off it.

  causal_discipline:
    group: reasoning
    description: >
      Refuse a causal claim the evidence does not support, while still
      reporting the pattern. The failure mode is a plausible mechanism stated
      as a finding.

  uncertainty_calibration:
    group: reasoning
    description: >
      Identify what cannot be determined from the sources, say so, and name
      the evidence that would settle it - rather than producing a number or a
      verdict anyway.

  # ---------------------------------------------------------- execution & judgment
  prioritization:
    group: execution_and_judgment
    description: >
      Identify which items require action now, order them against each other,
      and keep resolved, delegated or cosmetic items from displacing real work.

  planning:
    group: execution_and_judgment
    description: >
      Produce a sequence that actually runs: the right option chosen, work
      parallelised where it can be, and the schedule coherent with its own
      dependencies.

  resource_allocation:
    group: execution_and_judgment
    description: >
      Resolve contention for a scarce person or window, including choosing
      what that person should not do.

  ownership_and_delegation:
    group: execution_and_judgment
    description: >
      Establish who currently owns a piece of work, and route work to the
      person who should hold it.

  business_judgment:
    group: execution_and_judgment
    description: >
      Turn an analysis into a decision a leadership team can act on, choosing
      the metric the decision actually depends on, and stating the conclusion
      rather than leaving it in the workings.

  action_safety:
    group: execution_and_judgment
    description: >
      Decline actions the evidence rules out - sending confidential material
      externally, acting on a superseded instruction, scaling spend on a
      misleading figure, chasing an item that is already closed.

# Criterion -> capability. Keys are `<scenario>.<stable criterion id>`.
#
# One entry carries a `granularity: dimension` marker: monday-001 scores noise
# resistance as a dimension with six named false actions rather than as atomic
# criteria. It is included because it is a real 10-point measurement of exactly
# one capability, and excluding it would understate action_safety coverage by
# a third. It is flagged so no reader mistakes it for an atomic criterion.
criterion_mapping:

  # ------------------------------------------------------------- monday-001
  monday-001.contoso_action: {primary: prioritization, secondary: temporal_reasoning}
  monday-001.umbrella_action: {primary: prioritization, secondary: causal_discipline}
  monday-001.churn_action: {primary: prioritization}
  monday-001.analytics_action: {primary: prioritization, secondary: temporal_reasoning}
  monday-001.acme_resolved: {primary: state_reconstruction}
  monday-001.release_wednesday: {primary: state_reconstruction, secondary: temporal_reasoning}
  monday-001.contoso_blocked: {primary: state_reconstruction, secondary: dependency_reasoning}
  monday-001.launch_email_julia: {primary: ownership_and_delegation}
  monday-001.pricing_confidential: {primary: action_safety}
  monday-001.contoso_first: {primary: prioritization}
  monday-001.umbrella_and_churn_high: {primary: prioritization}
  monday-001.no_false_priorities: {primary: prioritization, secondary: action_safety}
  monday-001.umbrella_detected: {primary: quantitative_reasoning}
  monday-001.umbrella_metrics: {primary: quantitative_reasoning}
  monday-001.churn_numbers: {primary: quantitative_reasoning}
  monday-001.umbrella_error_rate: {primary: quantitative_reasoning}
  monday-001.umbrella_unknown_cause: {primary: causal_discipline}
  monday-001.friday_conversion_unknown: {primary: uncertainty_calibration}
  monday-001.churn_causality_unknown: {primary: causal_discipline}
  monday-001.noise_resistance: {primary: action_safety, granularity: dimension}

  # ------------------------------------------------------------- monday-002
  monday-002.launch_state: {primary: state_reconstruction}
  monday-002.stale_external_actions: {primary: action_safety, secondary: supersession}
  monday-002.current_owners: {primary: ownership_and_delegation}
  monday-002.executive_gate_superseded: {primary: supersession}
  monday-002.pricing_authority: {primary: supersession, secondary: action_safety}
  monday-002.ownership_supersession: {primary: supersession, secondary: ownership_and_delegation}
  monday-002.choose_option_b: {primary: planning, secondary: business_judgment}
  monday-002.option_b_sequence: {primary: dependency_reasoning}
  monday-002.schedule_feasibility: {primary: temporal_reasoning}
  monday-002.parallelize_work: {primary: planning}
  monday-002.immediate_release_decision: {primary: prioritization}
  monday-002.expansion_before_11: {primary: temporal_reasoning, secondary: prioritization}
  monday-002.globex_priority: {primary: prioritization, secondary: cross_source_reconciliation}
  monday-002.avoid_acme_false_positive: {primary: cross_source_reconciliation, secondary: causal_discipline}
  monday-002.expansion_fully_reconciled: {primary: quantitative_reasoning}
  monday-002.causal_boundary: {primary: causal_discipline}
  monday-002.customer_signal_integration: {primary: cross_source_reconciliation}
  monday-002.orion_missing_evidence: {primary: uncertainty_calibration}
  monday-002.conditional_launch_timing: {primary: uncertainty_calibration, secondary: action_safety}
  monday-002.no_unsupported_causality: {primary: causal_discipline}

  # ------------------------------------------------------------- monday-003
  monday-003.sso_chain: {primary: dependency_reasoning}
