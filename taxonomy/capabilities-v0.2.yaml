# Criteria the taxonomy fits least well. Carried from v0.1, plus one new.
awkward_fits:
  - criterion: monday-004.revenue_conclusion
    note: >
      Mapped to business_judgment, but what it really measures is whether the conclusion reached the reader rather than staying in the workings. That is executive communication, and MondayBench has no capability for it because nothing else measures it. This single criterion is the strongest internal evidence for the monday-005 concept.
  - criterion: monday-001.contoso_action
    note: >
      Sits on the boundary between noticing that an item needs action and ordering it against the others. The two are merged in this version; if a later scenario separates them the merge should be revisited.
  - criterion: monday-002.avoid_acme_false_positive
    note: >
      Primary cross_source_reconciliation because the contract is what explains the usage drop, but the failure it prevents is a causal one. The same shape appears as monday-004.acme_false_positive_avoided and both are mapped the same way for consistency.
  - criterion: monday-003.contoso_state_separated
    note: >
      Reads as state reconstruction but is scored partly on prioritization consequences - keeping the cosmetic request off the contractual chain.
  - criterion: monday-001.umbrella_detected
    note: >
      Anomaly detection across a metrics table. Filed under quantitative_reasoning, though "notice the outlier" is arguably its own skill; there is only one criterion of the kind, so no capability is created for it.
  - criterion: monday-005.hypotheses_carried_to_engineering
    note: >
      Mapped primary to information_routing because what it scores is whether
      both live hypotheses reach the engineering handoff at all. It is equally a
      test of uncertainty calibration - PASS requires making clear neither is
      tested - and that reading is recorded as the secondary. If a future
      scenario separates "did it arrive" from "was it labelled unconfirmed",
      this mapping should be revisited.
  - criterion: monday-005.status_page_publishable
    note: >
      Primary audience_adaptation, because it asks whether the public artifact
      contains what a public artifact needs. Its FAIL band also enumerates
      material that must not be public, which is a boundary question, recorded
      as the secondary. The two are hard to separate in one artifact-level
      criterion and this is the least comfortable mapping in monday-005.
