[project]
name = "mondaybench"
version = "0.1.0"
description = "MondayBench - a practical benchmark for reconstructing a messy workplace situation and deciding what matters"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.9",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
mondaybench = "mondaybench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mondaybench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
